# =============================================================================
# collision_detector 参数配置
# =============================================================================
# 所有距离单位: 米(m), 所有角度单位: 弧度(rad)
#
# 调参指南:
#   1. 先用 RViz 观察球体模型是否完整包裹住机械臂(调整 link_radii)
#   2. 再调整 ROI 让工作空间只覆盖必要区域(减少无效点云)
#   3. 最后根据机械臂运动速度调整阈值(速度越快, 阈值越大)
# =============================================================================

collision_detector:
  ros__parameters:

    # -----------------------------------------------------------------------
    # 点云输入
    # -----------------------------------------------------------------------
    # Orbbec 335 默认发布话题, 如果使用特定相机命名空间则需修改
    # 也可在运行时通过 /collision_detector/set_topic 动态切换
    point_cloud_topic: "/camera/depth/points"

    # -----------------------------------------------------------------------
    # 检测频率与性能
    # -----------------------------------------------------------------------
    # 10Hz 对于碰撞检测足够, 过高会占用CPU
    # 实际有效频率 = min(detection_hz, 点云发布频率)
    detection_hz: 10.0

    # 每 N 个点取一个, stride=4 将 640x480≈307k 点降到 ~77k 点
    # stride=6 → ~51k 点, stride=8 → ~38k 点
    # 建议: 先用 6 测试, 如果 CPU 占用 >30% 则增大
    downsample_stride: 4

    # -----------------------------------------------------------------------
    # 机械臂球体碰撞模型
    # -----------------------------------------------------------------------
    # 每个 link 用一个球体近似, 球心在 link 的 TF 原点
    # 半径 = link 最大外径 / 2 + 安全裕量(通常 +2~3cm)
    #
    # GCR5-910 各 link 参考尺寸:
    #   base_link: 底座, 直径~300mm → r=0.15m
    #   link_1:    肩部, 直径~240mm → r=0.12m
    #   link_2:    大臂, 直径~200mm → r=0.10m (修正: 原值0.12偏大)
    #   link_3:    肘部, 直径~180mm → r=0.09m
    #   link_4:    前臂, 直径~160mm → r=0.08m
    #   link_5:    腕部, 直径~140mm → r=0.07m
    #   link_6:    法兰, 直径~120mm → r=0.06m (末端执行器较细)
    link_names:
      - "base_link"
      - "link_1"
      - "link_2"
      - "link_3"
      - "link_4"
      - "link_5"
      - "link_6"

    link_radii:
      - 0.15   # base_link - 底座最宽
      - 0.12   # link_1
      - 0.10   # link_2
      - 0.09   # link_3
      - 0.08   # link_4
      - 0.07   # link_5
      - 0.06   # link_6 - 法兰最细

    # 自身过滤裕量: 球体半径 + self_filter_margin 内的点视为机械臂自身
    # 太小 → 自身点云会被误检为障碍物
    # 太大 → 紧贴机械臂的真正障碍物会被漏掉
    self_filter_margin: 0.04

    # -----------------------------------------------------------------------
    # ROI 工作空间过滤 (相机坐标系)
    # -----------------------------------------------------------------------
    # 只保留此包围盒内的点, 大幅减少计算量
    # 坐标系: 相机光心, X右/Y下/Z前(光轴方向)
    #
    # 顶视安装(相机朝下看):
    #   Z = 深度方向(向下), 典型 0.3~1.5m
    #   X,Y = 水平面, 根据工作台大小设置
    #
    # 如果不确定, 先设一个大范围, 用 RViz 观察点云再缩小
    enable_roi: true
    roi_x_min: -0.8
    roi_x_max:  0.8
    roi_y_min: -0.8
    roi_y_max:  0.8
    roi_z_min:  0.3    # 排除距离相机太近的噪声
    roi_z_max:  1.5    # 排除地面以下

    # -----------------------------------------------------------------------
    # 地面去除 (base_link 坐标系)
    # -----------------------------------------------------------------------
    # 在机械臂 base_link 坐标系下, Z=0 是底座安装面
    # ground_z 以下的点视为桌面/地面, 不参与碰撞检测
    # 典型值: -0.01 ~ -0.02 (略低于安装面, 容忍标定误差)
    enable_ground_removal: true
    ground_z: -0.01

    # -----------------------------------------------------------------------
    # 碰撞阈值 (表面距离, 即减去球体半径后)
    # -----------------------------------------------------------------------
    # 设计依据:
    #   - 机械臂最大速度 ~1m/s, 系统延迟 ~100ms → 制动距离 ~5cm
    #   - emergency: 已经非常近, 必须立即停 (≤3cm 含安全裕量)
    #   - warning:   进入危险区, 减速准备 (≤10cm)
    #   - caution:   有物体接近, 提示注意 (≤20cm)
    emergency_threshold: 0.03
    warning_threshold: 0.10
    caution_threshold: 0.20

    # -----------------------------------------------------------------------
    # 自动暂停控制
    # -----------------------------------------------------------------------
    auto_pause: true

    # 连续 N 帧 emergency 才触发暂停 (防抖, 抗噪声)
    # 1 = 不防抖(最灵敏), 3 = 推荐值(抗1~2帧噪声)
    emergency_confirm_frames: 3

    # -----------------------------------------------------------------------
    # RViz 可视化
    # -----------------------------------------------------------------------
    enable_visualization: true
    # 发布话题: /collision_detector/markers
    # 内容:
    #   - 球体: 显示每个 link 的碰撞模型, 颜色随状态变化
    #   - 最近点: 显示最近障碍物点和连线
    #   - ROI: 半透明包围盒显示 ROI 范围
